<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Check</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a2e;
      color: white;
      border-radius: 8px;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }
    .usage-container {
      background-color: #262640;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .usage-text {
      font-size: 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background-color: #1a1a2e;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background-color: #4CAF50;
      width: 0%;
      transition: width 0.3s ease;
    }
    .premium-msg {
      background: linear-gradient(90deg, #FF8C00 0%, #FF0080 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 600;
      font-size: 14px;
      text-align: center;
      margin-bottom: 20px;
    }
    .footer {
      font-size: 11px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">AI Check</h1>
  </div>
  
  <div class="usage-container">
    <div class="usage-text">
      <span>Free Checks Used</span>
      <span id="usage-count">0 / 3</span>
    </div>
    <div class="progress-bar">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
  </div>
  
  <div class="premium-msg">
    Premium coming soon - unlimited checks!
  </div>
  
  <div class="footer">
    Powered by AI Check
  </div>

  <script src="popup.js"></script>
</body>
</html>
