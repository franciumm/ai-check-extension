<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Check</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a2e;
      color: white;
      border-radius: 8px;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }
    .usage-container {
      background-color: #262640;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .usage-text {
      font-size: 14px;
      margin-bottom: 8px;
      color: #ccc;
    }
    .premium-msg {
      background: linear-gradient(90deg, #14b8a6 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 600;
      font-size: 14px;
      text-align: center;
      margin-bottom: 10px;
    }
    .license-input-wrapper {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
    }
    input {
        background: #1a1a2e;
        border: 1px solid #4b5563;
        color: white;
        padding: 8px;
        border-radius: 4px;
        font-size: 12px;
    }
    button {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 8px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }
    button:hover {
        background: #2563eb;
    }
    .footer {
      font-size: 11px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">AI Check</h1>
  </div>
  
  <div class="usage-container">
    <div class="usage-text">
      <strong>Free Local Scans:</strong> Unlimited
    </div>
  </div>
  
  <div class="premium-msg">
    Unlock Deep Scans ($5/800 scans)
  </div>
  
  <div class="license-input-wrapper">
      <input type="text" id="license-key" placeholder="Enter your license key..." />
      <button id="save-license">Save License</button>
  </div>
  
  <div class="footer">
    Powered by AI Check Local Engine
  </div>

  <script src="popup.js"></script>
</body>
</html>
